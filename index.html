<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/pacman.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Defined in <head> so it exists before ghost images can fail to load.
    function useClassicGhost(img, name) {
      img.onerror = null;
      img.classList.remove("sprite--portrait");
      img.src = `assets/ghost-${name}.svg`;
    }
  </script>
</head>
<body>
  <div class="layout">
  <main class="game">
    <header class="hud">
      <div class="hud__block">
        <span class="hud__label">1UP</span>
        <span class="hud__value" id="score">00</span>
      </div>
      <div class="hud__block">
        <span class="hud__label">HIGH SCORE</span>
        <span class="hud__value" id="high-score">10000</span>
      </div>
    </header>

    <section class="board" id="board" aria-label="Game board">
      <!-- Maze tiles are rendered from the layout in js/board.js -->

      <!-- Static sprite placements (wireframe only) -->
      <!-- Ghost portraits; each falls back to its classic ghost sprite if the image is missing -->
      <img class="sprite sprite--ghost sprite--portrait" data-ghost="blinky" src="assets/ghost-lee-min-ho.jfif"      alt="Lee Min-ho"     title="Lee Min-ho"     onerror="useClassicGhost(this, 'blinky')" style="grid-area: 12 / 14 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" data-ghost="inky" src="assets/ghost-park-seo-joon.jfif"   alt="Park Seo-joon"  title="Park Seo-joon"  onerror="useClassicGhost(this, 'inky')"   style="grid-area: 15 / 12 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" data-ghost="pinky" src="assets/ghost-hyun-bin.jfif"        alt="Hyun Bin"       title="Hyun Bin"       onerror="useClassicGhost(this, 'pinky')"  style="grid-area: 15 / 14 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" data-ghost="clyde" src="assets/ghost-ji-chang-wook.jfif"   alt="Ji Chang-wook"  title="Ji Chang-wook"  onerror="useClassicGhost(this, 'clyde')"  style="grid-area: 15 / 16 / span 1 / span 2">
      <img class="sprite sprite--pacman" src="assets/pacman.svg"      alt="Pac-Man" style="grid-area: 1 / 1">
      <div class="ready" style="grid-area: 18 / 11 / span 1 / span 8">READY!</div>
      <div class="banner" id="banner" role="status" aria-live="polite"></div>

      <!-- Intro card, hidden by js/director.js when Pac-Man starts moving -->
      <div class="intro" id="intro">
        <p class="intro__line intro__line--1">RUN AWAY FROM DISTRACTIONS,</p>
        <p class="intro__line intro__line--2">CHASE YOUR RESPONSIBILITIES!</p>
        <div class="intro__legend">
          <div>
            <h2 class="legend__title legend__title--chase">CHASE</h2>
            <ul class="legend" data-legend="responsibility"></ul>
          </div>
          <div>
            <h2 class="legend__title legend__title--avoid">AVOID</h2>
            <ul class="legend" data-legend="distraction"></ul>
          </div>
        </div>
        <p class="intro__start">PRESS AN ARROW KEY TO START</p>
      </div>
    </section>

    <footer class="status">
      <div class="lives" aria-label="Lives">
        <img src="assets/pacman.svg" alt="">
        <img src="assets/pacman.svg" alt="">
      </div>
      <div class="fruit" aria-label="Level fruit">
        <img src="assets/cherry.svg" alt="Cherry">
      </div>
    </footer>
  </main>

  <aside class="panel" id="panel" aria-label="Game status">
    <section class="panel__section">
      <h2 class="panel__label">DIFFICULTY</h2>
      <p class="panel__value" id="level-name">EASY</p>
      <p class="panel__sub" id="level-number">LEVEL 1/5</p>
      <div class="pips" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>
    <section class="panel__section">
      <h2 class="panel__label">NEXT LEVEL IN</h2>
      <p class="panel__value panel__value--timer" id="level-countdown">0:30</p>
      <div class="bar"><div class="bar__fill" id="level-bar"></div></div>
    </section>
    <section class="panel__section">
      <h2 class="panel__label">EFFECTS</h2>
      <ul class="effects" id="effects"></ul>
    </section>
    <section class="panel__section panel__section--legend">
      <h2 class="legend__title legend__title--chase">CHASE</h2>
      <ul class="legend" data-legend="responsibility"></ul>
      <h2 class="legend__title legend__title--avoid">AVOID</h2>
      <ul class="legend" data-legend="distraction"></ul>
    </section>
  </aside>
  </div>

  <script src="js/board.js"></script>
  <script src="js/pacman.js"></script>
  <script type="module" src="js/director.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
