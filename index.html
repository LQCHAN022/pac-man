<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Defined in <head> so it exists before ghost images can fail to load.
    function useClassicGhost(img, name) {
      img.onerror = null;
      img.classList.remove("sprite--portrait");
      img.src = `assets/ghost-${name}.svg`;
    }
  </script>
</head>
<body>
  <main class="game">
    <header class="hud">
      <div class="hud__block">
        <span class="hud__label">1UP</span>
        <span class="hud__value" id="score">00</span>
      </div>
      <div class="hud__block">
        <span class="hud__label">HIGH SCORE</span>
        <span class="hud__value" id="high-score">10000</span>
      </div>
    </header>

    <section class="board" id="board" aria-label="Game board">
      <!-- Maze tiles are rendered from the layout in js/board.js -->

      <!-- Static sprite placements (wireframe only) -->
      <!-- Ghost portraits; each falls back to its classic ghost sprite if the image is missing -->
      <img class="sprite sprite--ghost sprite--portrait" src="assets/ghost-lee-min-ho.jfif"      alt="Lee Min-ho"     title="Lee Min-ho"     onerror="useClassicGhost(this, 'blinky')" style="grid-area: 12 / 14 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" src="assets/ghost-park-seo-joon.jfif"   alt="Park Seo-joon"  title="Park Seo-joon"  onerror="useClassicGhost(this, 'inky')"   style="grid-area: 15 / 12 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" src="assets/ghost-hyun-bin.jfif"        alt="Hyun Bin"       title="Hyun Bin"       onerror="useClassicGhost(this, 'pinky')"  style="grid-area: 15 / 14 / span 1 / span 2">
      <img class="sprite sprite--ghost sprite--portrait" src="assets/ghost-ji-chang-wook.jfif"   alt="Ji Chang-wook"  title="Ji Chang-wook"  onerror="useClassicGhost(this, 'clyde')"  style="grid-area: 15 / 16 / span 1 / span 2">
      <img class="sprite sprite--pacman" src="assets/pacman.svg"      alt="Pac-Man" style="grid-area: 1 / 1">
      <div class="ready" style="grid-area: 18 / 11 / span 1 / span 8">READY!</div>
    </section>

    <footer class="status">
      <div class="lives" aria-label="Lives">
        <img src="assets/pacman.svg" alt="">
        <img src="assets/pacman.svg" alt="">
      </div>
      <div class="fruit" aria-label="Level fruit">
        <img src="assets/cherry.svg" alt="Cherry">
      </div>
    </footer>
  </main>

  <script src="js/board.js"></script>
  <script src="js/pacman.js"></script>
</body>
</html>
